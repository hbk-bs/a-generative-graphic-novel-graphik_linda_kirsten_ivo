<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GRAPHIK NOVEL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <div id="backlink">
		<style>
			#backlink {
				--color-accent: hsl(198, 100%, 50%);
				position: absolute;
				top: 8px;
				right: 8px;
				border: 1px dashed black;
				background-color: white;
				padding: 8px;
				cursor: pointer;
				color: black;
				font-size: 0.8rem;
				font-weight: bold;
				transition: all 0.3s ease;
				transform: rotate(-2deg) scale(0.9);
				box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.5);
				a {
					text-decoration: none;
					color: black;
					color: inherit;
					text-decoration: underline;
					background-image: linear-gradient(to right,
							var(--color-accent) 0%,
							var(--color-accent) 100%);
					background-size: 0% 100%;
					background-position: left center;
					background-repeat: no-repeat;
					transition: background-size 0.2s ease-in-out;
					padding: 0.5rem;
				}
				a:hover {
					background-size: 100% 100%;
					color: white;
				}

			}
			#backlink:hover {
				transform: rotate(2deg) scale(1);
			}
		</style>
		<a href="https://rundgang2025.qawsed.site">Back to the Rundgang 2025</a>
	</div>
  <div id="loading-screen">
    <div class="loading-container">
      <h2>LOAD...</h2>
      <div class="progress-bar">
        <div id="progress" class="progress"></div>
      </div>
      <p id="loading-status">0%</p>
    </div>
  </div>
  
  <div class="frame-container">
    <img id="stopMotion" src="/a-generative-graphic-novel-graphik_linda_kirsten_ivo/images2/1.png" alt="Stop Motion Frame">
    <div id="debug-info" class="debug-info"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
